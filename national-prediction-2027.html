$('grade').onclick=()=>{if(S.submitted)return;const n=Object.keys(S.answers).length;if(n<50&&!confirm('미응답 '+(50-n)+'문항이 있습니다. 오답으로 처리하고 채점할까요?'))return;if(!S.started){S.started=true;event('exam_start');}S.submitted=true;S.scoredAt=new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'});S.history=[...(S.history||[]),{at:S.scoredAt,wrong:Q.filter(q=>S.answers[q.i]!==q.k).map(q=>q.i)}].slice(-30);save();event('exam_complete');render();$('result').scrollIntoView();};$('reset').onclick=()=>{if(!confirm('이 별도 연습의 현재 답안을 비우고 다시 풀까요? 기존 학습 앱의 기록은 바뀌지 않습니다.'))return;S={answers:{},submitted:false,started:false,history:S.history||[]};wrongOnly=false;teacher=false;save();render();window.scrollTo(0,0);};$('wrong').onclick=()=>{wrongOnly=true;render();};$('all').onclick=()=>{wrongOnly=false;render();};$('teacher').onclick=()=>{teacher=!teacher;$('teacher').textContent=teacher?'정답·근거 접기':'정답·근거 모두 펼치기';render();};$('print').onclick=()=>window.print();render();try{window.BibleUsage?.visit();}catch{}})();
