<meta charset="utf-8">
<title>강남교회 성경고사 만점LAB</title>
<meta name="theme-color" content="#0f1517" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f7f6" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="강남교회 만점LAB">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f4f7f6; --surf:#ffffff; --surf2:#eef2f1; --line:#dde5e3;
  --ink:#131d1b; --ink2:#4a5a57; --ink3:#7c8b88;
  --acc:#0d7d6e; --acc-w:#0a6558; --acc-soft:#dcefeb;
  --warm:#c26a24; --warm-soft:#fbeadb;
  --ok:#12805f; --ok-soft:#dcf0e7; --bad:#b3403a; --bad-soft:#fae3e1;
  --shadow:0 1px 2px rgba(16,40,36,.06),0 8px 24px -12px rgba(16,40,36,.18);
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1517; --surf:#171f21; --surf2:#1e2729; --line:#2b3639;
  --ink:#e8efed; --ink2:#a6b5b1; --ink3:#7a8a86;
  --acc:#3fb3a0; --acc-w:#5cc9b6; --acc-soft:#12312d;
  --warm:#e0913f; --warm-soft:#33251a;
  --ok:#3fb38c; --ok-soft:#13302a; --bad:#e0736c; --bad-soft:#331e1d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#0f1517; --surf:#171f21; --surf2:#1e2729; --line:#2b3639;
  --ink:#e8efed; --ink2:#a6b5b1; --ink3:#7a8a86;
  --acc:#3fb3a0; --acc-w:#5cc9b6; --acc-soft:#12312d;
  --warm:#e0913f; --warm-soft:#33251a;
  --ok:#3fb38c; --ok-soft:#13302a; --bad:#e0736c; --bad-soft:#331e1d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;user-select:none;-webkit-user-select:none}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);overscroll-behavior-y:contain;
  font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:"Gothic A1","IBM Plex Sans KR",sans-serif;margin:0;text-wrap:balance;line-height:1.3}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:6px}
.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}

.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.brand{font-family:"Gothic A1";font-weight:900;font-size:17px;letter-spacing:-.02em}
.brand span{color:var(--acc)}
.streak{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--warm-soft);
  color:var(--warm);padding:5px 11px;border-radius:999px;font-weight:700;font-size:14px}
.ghost{border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px;color:var(--ink2)}

section.view{display:none;padding:20px 0 8px}
section.view.on{display:block}

.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}

/* 미션 */
.mission{display:flex;flex-direction:column;gap:10px}
.mi{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);
  border-radius:11px;background:var(--surf)}
.mi .ic{width:34px;height:34px;border-radius:9px;display:grid;place-content:center;
  font-size:16px;flex:0 0 34px}
.mi .tt{flex:1;min-width:0}.mi .tt b{font-size:14.5px;display:block}
.mi .tt span{font-size:12px;color:var(--ink3)}
.mi .st{font-family:"IBM Plex Mono";font-size:13px;font-weight:600;color:var(--ink2)}
.mi.done{border-color:var(--ok);background:var(--ok-soft)}
.mi.done .st{color:var(--ok)}
/* 히트맵 */
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--surf2);display:block}
.heat i.h1{background:color-mix(in srgb,var(--acc) 30%,var(--surf2))}
.heat i.h2{background:color-mix(in srgb,var(--acc) 60%,var(--surf2))}
.heat i.h3{background:var(--acc)}
.heat i.today{outline:1.5px solid var(--warm);outline-offset:1px}
.heatlb{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-top:6px}
/* 처방 */
.rx{display:flex;gap:10px;align-items:flex-start;background:var(--warm-soft);
  border:1px solid color-mix(in srgb,var(--warm) 35%,transparent);border-radius:12px;padding:13px 14px}
.rx .ic{font-size:18px}
.rx b{font-size:14px;color:var(--warm)}
.rx p{margin:3px 0 0;font-size:13px;color:var(--ink2);line-height:1.55}
/* 인터랙션 */
.opt{transition:border-color .12s,background .12s,transform .08s}
.opt:active:not(:disabled){transform:scale(.985)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.02)}100%{transform:scale(1)}}
.opt.ok{animation:pop .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}70%{transform:translateX(3px)}}
.opt.bad{animation:shake .28s ease}
.btn{transition:background .15s,transform .08s}
.btn:active{transform:scale(.99)}
/* 오늘 */
.hero{display:flex;gap:18px;align-items:center}
.ring{position:relative;width:104px;height:104px;flex:0 0 104px}
.ring svg{transform:rotate(-90deg)}
.ring .rt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .rt b{font-family:"Gothic A1";font-weight:900;font-size:26px;display:block;line-height:1}
.ring .rt i{font-style:normal;font-size:11px;color:var(--ink3)}
.big{font-family:"Gothic A1";font-weight:900;font-size:23px;letter-spacing:-.02em}
.sub{color:var(--ink2);font-size:14.5px}
.btn{background:var(--acc);color:#fff;border-radius:11px;padding:13px 18px;font-weight:600;
  width:100%;text-align:center;transition:background .15s}
.btn:hover{background:var(--acc-w)}
.btn.sec{background:var(--surf2);color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{background:var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini div{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center}
.mini b{font-family:"Gothic A1";font-weight:900;font-size:19px;display:block}
.mini span{font-size:11.5px;color:var(--ink3)}

/* 학년 색 */
:root{
  --s1:#0d7d6e; --s1b:#dcefeb; --s2:#2563a8; --s2b:#dde9f7;
  --s3:#6d4aa8; --s3b:#e8e0f6; --s4:#b06a12; --s4b:#fbeeda; --s5:#a8384f; --s5b:#fae0e5;
  --s6:#4a7a2a; --s6b:#e4f0da; --s7:#5b6470; --s7b:#e6e9ec;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --s1:#3fb3a0; --s1b:#12312d; --s2:#6aa6e8; --s2b:#132433; --s3:#a98ae0; --s3b:#221a33;
  --s4:#e0a24a; --s4b:#31240f; --s5:#e07a90; --s5b:#331820; --s6:#8fce6a; --s6b:#1e2b14;
  --s7:#a9b2ba; --s7b:#242a2e;
}}
:root[data-theme="dark"]{
  --s1:#3fb3a0; --s1b:#12312d; --s2:#6aa6e8; --s2b:#132433; --s3:#a98ae0; --s3b:#221a33;
  --s4:#e0a24a; --s4b:#31240f; --s5:#e07a90; --s5b:#331820; --s6:#8fce6a; --s6b:#1e2b14;
  --s7:#a9b2ba; --s7b:#242a2e;
}
.chip.sub{border-color:transparent;font-weight:600}
.chip.S1{background:var(--s1b);color:var(--s1)} .chip.S2{background:var(--s2b);color:var(--s2)}
.chip.S3{background:var(--s3b);color:var(--s3)} .chip.S4{background:var(--s4b);color:var(--s4)}
.chip.S5{background:var(--s5b);color:var(--s5)} .chip.S6{background:var(--s6b);color:var(--s6)}
.chip.S7{background:var(--s7b);color:var(--s7)}

/* 문항 본문 3층 구조 */
.stem{display:flex;flex-direction:column;gap:13px;margin-bottom:18px}
.lead{margin:0;font-size:15.5px;line-height:1.62;color:var(--ink2)}
.ask{margin:0;font-size:17.5px;font-weight:700;line-height:1.55;color:var(--ink);
  letter-spacing:-.01em;text-wrap:pretty;overflow-wrap:anywhere}

/* 문항 */
.qmeta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--surf2);color:var(--ink2);
  border:1px solid var(--line);font-weight:500}
.chip.acc{background:var(--acc-soft);color:var(--acc);border-color:transparent;font-weight:600}
.chip.warn{background:var(--warm-soft);color:var(--warm);border-color:transparent;font-weight:600}
.qtext{font-size:16.5px;font-weight:500;white-space:pre-wrap;margin-bottom:16px;line-height:1.7}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  background:var(--surf);border:1.5px solid var(--line);border-radius:11px;padding:12px 13px;
  font-size:15px;line-height:1.55;transition:border-color .12s,background .12s}
.opt span{flex:1;min-width:0;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--acc-soft)}
.opt b{flex:0 0 22px;height:22px;border-radius:50%;background:var(--surf2);color:var(--ink2);
  display:grid;place-content:center;font-size:12.5px;font-weight:700;margin-top:1px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok b{background:var(--ok);color:#fff}
.opt.selected{border-color:var(--acc);background:var(--acc-soft)}
.opt.selected b{background:var(--acc);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad b{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.opt.dim{opacity:.55}

.expl{margin-top:16px;border-left:3px solid var(--acc);background:var(--surf2);
  border-radius:0 10px 10px 0;padding:14px 15px;font-size:14.5px;line-height:1.72;white-space:pre-wrap}
.verdict{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:12px;font-size:15px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}

.prog{height:5px;background:var(--surf2);border-radius:99px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}

/* 고정 액션바 */
.fab{position:fixed;left:16px;right:16px;z-index:25;max-width:560px;margin:0 auto;
  bottom:calc(74px + env(safe-area-inset-bottom))}
.fab .btn{box-shadow:0 6px 20px -6px rgba(13,60,52,.45)}
.fb-pad{height:76px}
@media(min-width:620px){ .fab{position:static;max-width:none;margin-top:14px}
  .fab .btn{box-shadow:none} .fb-pad{display:none} }
/* 시험 헤더 고정 */
.exhead{position:sticky;top:56px;z-index:18;margin:0 -16px;padding:10px 16px 8px;
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px)}
/* 태블릿 2단 시험 */
@media(min-width:900px){
  .exwrap{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
  .exside{position:sticky;top:128px}
}
/* 분석 */
.bar{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.bar .l{display:flex;justify-content:space-between;font-size:13.5px;align-items:baseline;gap:8px}
.bar .l span:first-child{color:var(--ink);font-weight:500;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t{height:8px;background:var(--surf2);border-radius:99px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:99px;transition:width .4s}
.pct{color:var(--ink2);font-size:12.5px}

/* 모의고사 */
.timer{font-family:"IBM Plex Mono";font-weight:600;font-size:15px;background:var(--surf2);
  border:1px solid var(--line);padding:5px 11px;border-radius:9px}
.timer.warn{color:var(--bad);border-color:var(--bad)}
.grid5{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.gq{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;font-size:12px;font-weight:600;
  background:var(--surf);color:var(--ink3);display:grid;place-content:center}
.gq.done{background:var(--acc-soft);color:var(--acc);border-color:transparent}
.gq.cur{outline:2px solid var(--acc);outline-offset:1px}
.result{text-align:center;padding:8px 0 4px}
.result .score{font-family:"Gothic A1";font-weight:900;font-size:46px;line-height:1}
.badge{display:inline-block;padding:6px 16px;border-radius:999px;font-weight:700;font-size:14px;margin-top:10px}
.badge.pass{background:var(--ok-soft);color:var(--ok)}
.badge.mid{background:var(--warm-soft);color:var(--warm)}
.badge.fail{background:var(--bad-soft);color:var(--bad)}

/* 학년 선택 */
.gradepick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gradepick button{padding:10px 6px;border-radius:10px;border:1.5px solid var(--line);background:var(--surf);
  font-size:13.5px;font-weight:600;color:var(--ink2)}
.gradepick button.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surf);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding:0}
nav.tabs button{padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink3);font-size:11px;font-weight:600;border-top:2.5px solid transparent}
nav.tabs button.on{color:var(--acc);border-top-color:var(--acc)}
nav.tabs svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.empty{text-align:center;color:var(--ink3);padding:40px 20px;font-size:14.5px}
.load{position:fixed;inset:0;display:grid;place-content:center;background:var(--bg);z-index:99;gap:12px;text-align:center}
.load .b{width:180px;height:5px;background:var(--surf2);border-radius:99px;overflow:hidden}
.load .b i{display:block;height:100%;width:38%;background:var(--acc);border-radius:99px;
  animation:sl 1.1s ease-in-out infinite}
@keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(360%)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(min-width:768px){
  .wrap{max-width:720px}
  body{font-size:17px}
  .ask{font-size:19px}
  .opt{font-size:16px;padding:14px 16px}
  .qtext{font-size:17px}
  #v-today .stack,#v-stats .stack,#v-exam .stack{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  #v-today .stack>.hero,#v-today .stack>.rx,#v-today .stack>#go,
  #v-today .stack>.mini,#v-today .stack>.card:last-child,
  #v-stats .stack>.card:first-child,#v-stats .stack>#reset,
  #v-exam .stack>.card:last-child{grid-column:1/-1}
  #v-review .stack{max-width:560px;margin:0 auto}
}
@media(min-width:900px){ .wrap{max-width:940px}
  #v-today .stack,#v-stats .stack,#v-exam .stack{max-width:720px;margin:0 auto} }
@media(min-width:620px){ body{padding-bottom:24px}
  nav.tabs{position:sticky;top:56px;bottom:auto;border-top:none;border-bottom:1px solid var(--line)}
  nav.tabs button{border-top:none;border-bottom:2.5px solid transparent;padding:10px 4px}
  nav.tabs button.on{border-bottom-color:var(--acc)}
}
</style>

<div class="load" id="load"><div style="font-family:'Gothic A1';font-weight:900;font-size:18px">강남교회 성경고사 <span style="color:var(--acc)">만점LAB</span></div>
<div class="b"><i></i></div><div style="font-size:13px;color:var(--ink3)">문제은행 불러오는 중…</div></div>

<header class="top"><div class="wrap">
  <div class="brand">강남교회 성경고사 <span>만점LAB</span></div>
  <div class="streak" id="streak" hidden>🔥 <span class="num" id="streakN">0</span>일</div>
  <button class="ghost" id="themeBtn" aria-label="테마 전환">◐</button>
</div></header>

<nav class="tabs"><div class="wrap">
  <button data-v="today" class="on"><svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="5"/></svg>오늘</button>
  <button data-v="review"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>복습</button>
  <button data-v="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>분석</button>
  <button data-v="exam"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/></svg>모의고사</button>
</div></nav>

<main class="wrap">
  <section class="view on" id="v-today"></section>
  <section class="view" id="v-review"></section>
  <section class="view" id="v-stats"></section>

 "친구를 응원하는 마음", "prayer": "하나님, 함께 성경을 배우는 친구들을 축복해 주세요. 친구의 좋은 결과를 함께 기뻐하고, 어려워하는 친구에게 따뜻한 말을 건네게 해 주세요. 서로를 응원하며 함께 하나님을 알아가는 시간이 되게 해 주세요. 예수님의 이름으로 기도합니다. 아멘."}, {"date": "2026-11-14", "theme": "결과와 함께 배움을 돌아보기", "prayer": "하나님, 오늘도 성경을 읽고 배우게 해 주셔서 감사합니다. 오늘의 점수를 보면서 새롭게 알게 된 말씀도 함께 떠올리게 해 주세요. 기대한 결과가 나오지 않아도 하나님을 알아가는 시간을 주심에 감사하고, 다시 배울 힘을 얻게 해 주세요. 예수님의 이름으로 기도합니다. 아멘."}, {"date": "2026-11-15", "theme": "끝까지 배우는 용기", "prayer": "하나님, 공부가 길어져 지치거나 하기 싫은 마음이 들 때 도와주세요. 필요한 때에는 잠시 쉬고, 다시 마음을 모아 오늘의 공부를 이어가게 해 주세요. 어려움 속에서도 포기하지 않고 하나님을 알아가는 기쁨을 누리게 해 주세요. 예수님의 이름으로 기도합니다. 아멘."}, {"date": "2026-11-16", "theme": "말씀을 마음과 생활에", "prayer": "하나님, 배운 말씀을 우리의 마음에 새겨 주세요. 기억한 내용을 일상에서도 떠올리고, 정직하게 말하며 서로 사랑하게 해 주세요. 성경을 배우는 시간이 하나님을 더욱 신뢰하고 따르는 시간으로 이어지게 해 주세요. 예수님의 이름으로 기도합니다. 아멘."}, {"date": "2026-11-17", "theme": "걱정을 하나님께 맡기기", "prayer": "하나님, 시험이 가까워져 걱정되는 마음을 하나님께 말씀드립니다. 다른 친구와 비교하기보다 오늘 할 일을 차분하게 하도록 도와주세요. 우리를 사랑하시는 하나님을 기억하며 평안한 마음으로 배우게 해 주세요. 예수님의 이름으로 기도합니다. 아멘."}, {"date": "2026-11-18", "theme": "차분하게 집중하기", "prayer": "하나님, 오늘은 배운 내용을 차분하게 확인하려고 합니다. 문제를 끝까지 읽고, 아는 것도 서두르지 않으며 정직하게 풀게 해 주세요. 잘 풀리는 순간에도 어려운 순간에도 하나님을 의지하고, 배우는 시간을 감사하게 해 주세요. 예수님의 이름으로 기도합니다. 아멘."}, {"date": "2026-11-19", "theme": "성실하게 준비하고 신뢰하기", "prayer": "하나님, 여기까지 말씀을 배우며 준비하게 해 주셔서 감사합니다. 아직 부족한 부분을 살피고, 남은 시간도 성실하게 보내게 해 주세요. 우리의 노력과 마음을 하나님께 맡기며, 어떤 결과 앞에서도 감사와 겸손을 잃지 않게 해 주세요. 예수님의 이름으로 기도합니다. 아멘."}, {"date": "2026-11-20", "theme": "감사하며 쉬기", "prayer": "하나님, 내일 예선을 앞두고 오늘까지 배우게 하신 은혜에 감사합니다. 기억이 잘 나지 않는 내용 때문에 너무 걱정하지 않게 해 주세요. 배운 말씀을 가볍게 돌아보고 편안히 쉬게 하시며, 내일도 하나님을 신뢰하는 마음으로 참여하게 해 주세요. 예수님의 이름으로 기도합니다. 아멘."}, {"date": "2026-11-21", "theme": "어떤 결과 앞에서도 감사와 영광", "prayer": "하나님, 오늘 예선에 참여합니다. 성경을 배우며 하나님을 알아가는 시간을 주셔서 감사합니다. 준비한 것을 차분하고 정직하게 풀게 해 주세요. 좋은 결과에는 겸손히 하나님께 영광을 돌리고, 기대에 미치지 못해도 배우게 하신 은혜에 감사하게 해 주세요. 예수님의 이름으로 기도합니다. 아멘."}], "closingPrayer": "하나님, 오늘 성경을 배우며 하나님을 알아가는 시간을 주셔서 감사합니다. 좋은 결과를 얻었을 때에는 겸손히 하나님께 영광을 돌리고, 기대한 만큼 나오지 않았을 때에도 배울 기회를 주심에 감사하게 해 주세요. 배운 말씀을 마음에 새기고 생활 const memoryAliases=id=>{const l=MEMORY_LESSONS.find(x=>x.id===id);return l?MEMORY_LESSONS.filter(x=>memorySignature(x)===memorySignature(l)).map(x=>x.id):[id];};
function recordMemory(id,kind,ok){
  for(const mid of memoryAliases(id)){
    const p=S.memoryProgress[mid]||{reads:0,quizN:0,quizC:0};
    if(kind==='read'){p.reads++;p.lastRead=today();}
    else if(kind==='recall'){p.recalled=ok;p.lastRecall=today();}
    S.memoryProgress[mid]=p;
  }save();
}
function memoryDailyLessons(){
  const info=prepInfo();if(!info||S.myGrade!=='초등부')return [];
  if(!S.memoryPlans[today()]){
    const ranked=[...MEMORY_LESSONS].sort((a,b)=>{
      const pa=S.memoryProgress[a.id]||{},pb=S.memoryProgress[b.id]||{};
      if(info.daysLeft<=1)return Number(pa.recalled===true)-Number(pb.recalled===true)||((pb.quizN||0)-(pb.quizC||0))-((pa.quizN||0)-(pa.quizC||0));
      return Number(!!pa.reads)-Number(!!pb.reads)||Number(pa.recalled===true)-Number(pb.recalled===true)||((pb.quizN||0)-(pb.quizC||0))-((pa.quizN||0)-(pa.quizC||0));
    });
    const signatures=new Set(),picked=[];
    for(const l of ranked){const key=memorySignature(l);if(signatures.has(key))continue;signatures.add(key);picked.push(l.id);if(picked.length===5)break;}
    S.memoryPlans[today()]=picked;save();
  }
  return S.memoryPlans[today()].map(id=>MEMORY_LESSONS.find(l=>l.id===id)).filter(Boolean);
}

}
function markDay(cat){

}
const doneToday=()=>S.days[today()]||0;
const isMultiAnswer=q=>Array.isArray(q.k)&&q.k.length>1;
const isCorrect=(q,answer)=>{
  if(isMultiAnswer(q)) return Array.isArray(answer)&&answer.length===q.k.length&&q.k.every(j=>answer.includes(j));
  return !Array.isArray(q.k)&&answer===q.k;
};
const answerLabel=q=>Array.isArray(q.k)?q.k.join(',')+'번':q.k+'번';

/* ── 진행 기록 (내 학년 문제만 대상) ───────── */
function record(q,ok){
  const p=S.prog[q.i]||{n:0,c:0,box:0,due:0};
  p.n++; if(ok){p.c++; p.box=Math.min(6,p.box+1);} else {p.box=0;}
  p.due=Date.now()+IV[p.box]*864e5; p.last=ok?1:0;
  S.prog[q.i]=p; save();
  if(q.mids){for(const mid of new Set(q.mids.flatMap(memoryAliases))){const m=S.memoryProgress[mid]||{reads:0,quizN:0,quizC:0};m.quizN=(m.quizN||0)+1;if(ok)m.quizC=(m.quizC||0)+1;S.memoryProgress[mid]=m;}save();}
}
const dueList=()=>reviewPool().filter(q=>{const p=S.prog[q.i];return p&&p.last===0||(p&&p.due<=Date.now()&&p.n>0&&p.c/p.n<1)});
const wrongList=()=>reviewPool().filter(q=>{const p=S.prog[q.i];return p&&p.n>p.c});
const reviewPriority=items=>[...items].sort((a,b)=>{
  const pa=S.prog[a.i]||{n:0,c:0},pb=S.prog[b.i]||{n:0,c:0};
  return (pb.n-pb.c)-(pa.n-pa.c)||(pa.n?pa.c/pa.n:1)-(pb.n?pb.c/pb.n:1)||(pa.due||0)-(pb.due||0);
});
const repeatedWrongList=()=>reviewPriority(wrongList().filter(q=>S.prog[q.i].n-S.prog[q.i].c>=2));
function personalReview(g,n,fallback=[]){
  const pool=BY[g]||[],wrong=reviewPriority(pool.filter(q=>S.prog[q.i]&&S.prog[q.i].n>S.prog[q.i].c));
  const weak=Object.values(areaStats()).filter(a=>a.k.startsWith(g+'|')&&a.n>=3&&a.r<.8).sort((a,b)=>a.r-b.r).slice(0,6).map(a=>a.k);
  const candidates=[...wrong,...pool.filter(q=>weak.includes(g+'|'+(q.a||'기타'))),...fallback,...pool];
  return [...new Map(candidates.map(q=>[q.i,q])).values()].slice(0,n);
}
function distinctDailyQuestions(g,n,preferred=[],candidatePool=null){
  const history=S.dailySelections[today()+'|'+g]||[], previous=new Set(history.at(-1)||[]), counts=new Map();
  history.flat().forEach(id=>counts.set(id,(counts.get(id)||0)+1));
  (S.planDone[today()]||[]).forEach(id=>{if(!counts.has(id))counts.set(id,1);});
  const ranked=candidatePool?[...new Map([...reviewPriority(candidatePool.filter(q=>S.prog[q.i]&&S.prog[q.i].n>S.prog[q.i].c)),...preferred.filter(q=>candidatePool.includes(q)),...shuffle([...candidatePool])].map(q=>[q.i,q])).values()]:personalReview(g,(BY[g]||[]).length,preferred), rank=new Map(ranked.map((q,i)=>[q.i,i]));
  return [...ranked].sort((a,b)=>Number(previous.has(a.i))-Number(previous.has(b.i))
    ||(counts.get(a.i)||0)-(counts.get(b.i)||0)
    ||Number(!!S.prog[a.i])-Number(!!S.prog[b.i])
    ||rank.get(a.i)-rank.get(b.i)).slice(0,n);
}
function rememberDailySelection(g,qs){
  const key=today()+'|'+g;
  S.dailySelections[key]=[...(S.dailySelections[key]||[]),qs.map(q=>q.i)].slice(-14);
  const keys=Object.keys(S.dailySelections).sort();
  keys.slice(0,Math.max(0,keys.length-21)).forEach(k=>delete S.dailySelections[k]);
  save();
}
function focusedPractice(g,items,n,preferred=[]){
  const previous=new Set((S.dailySelections[today()+'|'+g]||[]).at(-1)||[]);
  const weak=items.filter(q=>{const p=S.prog[q.i];return !previous.has(q.i)&&((p&&p.n>p.c&&(p.last===0||p.box<3))||(q.mids||[]).some(id=>S.memoryProgress[id]?.recalled===false));});
  const reviewN=Math.min(Math.floor(n*.2),weak.length);
  const review=distinctDailyQuestions(g,reviewN,weak,weak),used=new Set(review.map(q=>q.i));
  return [...review,...distinctDailyQuestions(g,n-reviewN,preferred,items.filter(q=>!used.has(q.i)))];
}

/* ── 문항 선택 ──────────────────────────── */
function missionPlan(n){
  const due=dueList().length;
  const rev=Math.min(due,Math.round(n*0.4));
  const weak=Math.round(n*0.3);
  return {rev,weak,fresh:n-rev-weak};
}
function pickDaily(n){
  const plan=missionPlan(n), out=[];
  const due=dueList().sort((a,b)=>(S.prog[a.i].due)-(S.prog[b.i].due));
  due.slice(0,plan.rev).forEach(q=>{q._cat='rev';out.push(q);});
  const rxKeys=(S.rx||[]).map(r=>r.k);
  const weakKeys=[...rxKeys,...weakAreas(6).map(w=>w.k)];
  const base=myPool();
  const fresh=base.filter(q=>!S.prog[q.i]);
  const pool=fresh.length?fresh:base.filter(q=>{const p=S.prog[q.i];return p&&p.box<3});
  const wq=shuffle(pool.filter(q=>weakKeys.includes(q.s+'|'+(q.a||'기타'))));
  wq.slice(0,plan.weak).forEach(q=>{if(!out.includes(q)){q._cat='weak';out.push(q);}});
  for(const q of shuffle([...pool])){ if(out.length>=n)break;
    if(!out.includes(q)){ q._cat='fresh'; out.push(q);} }
  return shuffle(out);
}
function todayPlanQuestions(g,round=1){
  const info=prepInfo(), pool=[...(BY[g]||[])].sort((a,b)=>(a.qnum||0)-(b.qnum||0)||String(a.i).localeCompare(String(b.i)));
  if(!info||!pool.length)return [];
  if(g==='초등부'&&info.memoryCount){
    const lessonIds=new Set(memoryDailyLessons().map(l=>l.id));
    const preferred=MEMORY_Q.filter(q=>q.mids.some(id=>lessonIds.has(id)));
    const memory=focusedPractice(g,MEMORY_Q,info.memoryCount,preferred);
    const general=focusedPractice(g,pool.filter(q=>q.src!=='외'),info.count-info.memoryCount);
    return shuffle([...memory,...general]).map(q=>{q._cat='plan';return q;});
  }
  let picked=[];
  if(info.day<=14){
    const slot=info.day<=7?info.day-1:info.day-8;
    const start=Math.floor(slot*pool.length/7), end=Math.floor((slot+1)*pool.length/7);
    picked=pool.slice(start,end);
    if(info.day>7)picked.sort((a,b)=>((S.prog[b.i]?.last===0?1:0)-(S.prog[a.i]?.last===0?1:0)));
  }else if(info.day<=16){
    picked=buildMockExam(g);
  }else{
    const priority=[...wrongList().filter(q=>q.src==='외'),...wrongList(),...pool.filter(q=>q.src==='외'),...pool];
    picked=[...new Map(priority.map(q=>[q.i,q])).values()].slice(0,info.count);
  }
  if(round>1||(S.dailySelections[today()+'|'+g]||[]).length)picked=distinctDailyQuestions(g,info.count,picked);
  return picked.slice(0,info.count).map(q=>{q._cat='plan';return q;});
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function areaStats(){
  const m={};
  for(const [k,qs] of Object.entries(AREAS)){
    let n=0,c=0; for(const q of qs){const p=S.prog[q.i]; if(p){n+=p.n;c+=p.c;}}
    if(n) m[k]={k,n,c,r:c/n,tot:qs.length};
  }
  return m;
}
function weakAreas(top){
  return Object.values(areaStats()).filter(a=>a.k.startsWith(S.myGrade+'|')&&a.n>=3).sort((a,b)=>a.r-b.r).slice(0,top);
}

function renderMemoryCard(el,ss,onEnd){

  el.querySelector('#memoryQuit').onclick=onEnd;
  el.querySelector('#memoryHide').onclick=()=>{ss.memoryHidden=!ss.memoryHidden;renderMemoryCard(el,ss,onEnd);};
  const next=ok=>{recordMemory(l.id,'recall',ok);const done=S.memoryDayDone[today()]||[];S.memoryDayDone[today()]=[...new Set([...done,...memoryAliases(l.id)])];save();ss.memoryIndex=(ss.memoryIndex||0)+1;ss.memoryHidden=false;window.scrollTo(0,0);renderSession(el,ss,onEnd);};
  el.querySelector('#memoryRecall').onclick=()=>{if(ss.memoryHidden)next(true);};el.querySelector('#memoryDifficult').onclick=()=>next(false);
}
function renderSession(el,ss,onEnd){
  if(ss.isToday&&ss.i===0&&!ss.prayed&&S.prayerSeenOn!==today()){
    S.prayerSeenOn=today();save();
    return renderPrayer(el,()=>{ss.prayed=true;renderSession(el,ss,onEnd);},onEnd,ss.round?`오늘의 학습 ${ss.round}회차`:'오늘의 학습');
  }

  if(ss.i>=ss.qs.length)return renderDone(el,ss,onEnd);
  const q=ss.qs[ss.i], picked=ss.ans[ss.i], multi=isMultiAnswer(q);
  const selected=multi&&Array.isArray(picked)?picked:[];
  el.innerHTML=`
    <div class="prog"><i style="width:${ss.i/ss.qs.length*100}%"></i></div>
    <div class="row" style="margin-bottom:12px">
      <span class="eyebrow">${ss.mode==='review'?'복습':ss.round?`오늘의 학습 ${ss.round}회차`:'오늘의 학습'} ${ss.i+1} / ${ss.qs.length}</span>

        ${multi?`<span class="chip warn">복수정답 · ${q.k.length}개 모두 선택</span>`:''}
        ${q.flag&&q.flag.startsWith('확인요망')?'<span class="chip warn">⚠ 검토중</span>':''}</div>
      <div class="stem"><p class="ask">${esc(q.q)}</p></div>
      <div class="opts">${q.o.map((o,j)=>`<button class="opt${selected.includes(j+1)?' selected':''}" data-j="${j+1}"><b>${j+1}</b><span>${esc(o)}</span></button>`).join('')}</div>
      ${multi?`<div class="sub" style="margin-top:12px">정답 ${q.k.length}개를 모두 선택하세요. 선택한 보기를 다시 누르면 취소할 수 있습니다.</div><button class="btn" id="check-multi" style="margin-top:10px" ${selected.length===q.k.length?'':'disabled'}>정답 확인 (${selected.length}/${q.k.length})</button>`:''}
      <div id="fb"></div>

  const opts=[...el.querySelectorAll('.opt')];
  const commit=j=>{
    const ok=isCorrect(q,j); ss.ans[ss.i]=j;
    if(ss.mode!=='exam'){ record(q,ok); const planned=ss.mode==='daily'&&ss.round>0; if(planned){const arr=S.planDone[today()]||[];if(!arr.includes(q.i)){arr.push(q.i);S.planDone[today()]=arr;}S.planAttempts[today()]=(S.planAttempts[today()]||0)+1;} markDay(planned?'plan':ss.mode==='review'?'rev':q._cat||'fresh'); }
    const kArr=Array.isArray(q.k)?q.k:[q.k], chosenArr=Array.isArray(j)?j:[j];
    opts.forEach(b=>{ b.disabled=true; const bj=+b.dataset.j;
      if(kArr.includes(bj))b.classList.add('ok'); else if(chosenArr.includes(bj))b.classList.add('bad'); else b.classList.add('dim'); });
    el.querySelector('#fb').innerHTML=`
      <div class="expl"><div class="verdict ${ok?'ok':'bad'}">${ok?'✓ 정답':'✗ 오답 · 정답은 '+answerLabel(q)}</div>${esc(q.e||'').replace(/\n/g,'<br>')}</div>

      check.textContent=`정답 확인 (${now.length}/${q.k.length})`;
    });
    el.querySelector('#check-multi').onclick=()=>commit(ss.ans[ss.i]);
  }else opts.forEach(b=>b.onclick=()=>commit(+b.dataset.j));
}

/* 실제 공지의 출처 구분과 배점을 적용. 복수정답·4개 초과 보기는 실전 모의고사에서 제외. */
let ex=null,exT=null;
const SEC_PER=50;
const officialFormat=q=>q.o.length===4&&!Array.isArray(q.k)&&Number.isInteger(q.k)&&q.k>=1&&q.k<=4;
function spreadPick(items,n){
  const shuffled=shuffle([...items]), byUnit={};
  shuffled.forEach(q=>{(byUnit[q.a||'기타']=byUnit[q.a||'기타']||[]).push(q);});
  const picked=Object.values(byUnit).map(a=>a[0]).slice(0,n), used=new Set(picked.map(q=>q.i));
  for(const q of shuffled){if(picked.length>=n)break;if(!used.has(q.i)){picked.push(q);used.add(q.i);}}
  return picked;
}
function buildLegacyMockExam(g){
  const pool=(BY[g]||[]).filter(officialFormat);
  const teacher=spreadPick(pool.filter(q=>q.src==='교'),40);
  if(teacher.length<40)throw new Error(`${GRADEN[g]} 교사용 예상문제의 실전형 문항이 40개 미만입니다.`);
  const used=new Set(teacher.map(q=>q.i)), later=[];
  for(const [src,count] of [['학',4],['본',3],['외',3]]){
    const candidates=pool.filter(q=>q.src===src&&!used.has(q.i));
    const selected=spreadPick(candidates,count);
    selected.forEach(q=>{used.add(q.i);later.push(q);});
  }
  if(later.length<10){
    const candidates=pool.filter(q=>['학','본','외'].includes(q.src)&&!used.has(q.i));
    spreadPick(candidates,10-later.length).forEach(q=>{used.add(q.i);later.push(q);});
  }
  if(later.length<10)throw new Error(`${GRADEN[g]} 공과·성경·암송 출처의 실전형 문항이 10개 미만입니다.`);
  let qs=[...shuffle(teacher),...shuffle(later)];
  const n=qs.length;
  qs.forEach((q,idx)=>{ q.pts = idx < Math.max(0,n-10) ? 1.7 : 3.2; });
  return qs;
}
function buildMockExam(g){
  if(g!=='초등부'||!MEMORY_Q.length)return buildLegacyMockExam(g);
  const last=S.mockSelections[g]||{}, patternIndex=((last.pattern??-1)+1)%MEMORY_PATTERNS.length;
  const pattern=MEMORY_PATTERNS[patternIndex], previous=new Set(last.ids||[]),used=new Set();
  const draw=(items,n)=>{
    const shuffled=shuffle(items.filter(q=>!used.has(q.i))),picked=[];
    for(const part of [shuffled.filter(q=>!previous.has(q.i)),shuffled.filter(q=>previous.has(q.i))]){
      const units=new Set();
      for(const q of part){if(picked.length>=n)break;if(!used.has(q.i)&&!units.has(q.a)){picked.push(q);used.add(q.i);units.add(q.a);}}
      for(const q of part){if(picked.length>=n)break;if(!used.has(q.i)){picked.push(q);used.add(q.i);}}
    }
    if(picked.length!==n)throw new Error('검수된 모의고사 문항이 부족합니다.');
    return picked;
  };
  const typed=counts=>Object.entries(counts).flatMap(([type,n])=>draw(type==='meaning'?(BY[g]||[]).filter(q=>q.memoryType==='meaning'&&officialFormat(q)):MEMORY_Q.filter(q=>q.memoryType===type),n));
  const firstMemory=typed(pattern.first),lastMemory=typed(pattern.last);
  const first=[...draw((BY[g]||[]).filter(q=>q.src==='교'&&officialFormat(q)),40-firstMemory.length),...firstMemory];
  const later=[...draw((BY[g]||[]).filter(q=>['학','본'].includes(q.src)&&officialFormat(q)),10-lastMemory.length),...lastMemory];
  const qs=[...shuffle(first),...shuffle(later)].map((q,i)=>({...q,pts:i<40?1.7:3.2}));
  qs.blueprint={year:pattern.year,index:patternIndex,memoryTotal:firstMemory.length+lastMemory.length,firstMemory:firstMemory.length,lastMemory:lastMemory.length};
  return qs;
}

      ${hist.map(e=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)">

      </div>`).join('')}</div>`:''}

  wireGradepick(el,vExam);
  el.querySelectorAll('.exs').forEach(b=>b.onclick=()=>startExam(b.dataset.g));

function startExam(g){
  const qs=buildMockExam(g);
  const setName=`${GRADEN[g]} ${qs.blueprint?qs.blueprint.year+' 기출 비율형':'모의고사'} · ${today()}`;
  if(qs.blueprint){S.mockSelections[g]={ids:qs.map(q=>q.i),pattern:qs.blueprint.index};save();}
  ex={qs,i:0,ans:{},phase:'ready',setName};
  beginExam();
}
function beginExam(){
  if(!ex||ex.phase!=='ready')return;
  ex.phase='run';ex.end=Date.now()+ex.qs.length*SEC_PER*1000;
  clearInterval(exT);
  exT=setInterval(()=>{ if(VIEW!=='exam'||!ex||ex.phase!=='run')return;

    const left=ex.end-Date.now(); if(left<=0){submitExam();return;}
    t.textContent=fmt(left); t.classList.toggle('warn',left<5*60000); },1000);
  vExam();
}
const fmt=ms=>{const s=Math.max(0,ms/1000|0);return `${String(s/3600|0).padStart(2,'0')}:${String(s/60%60|0).padStart(2,'0')}:${String(s%60|0).padStart(2,'0')}`;};

          <div class="row" style="margin-top:16px;gap:8px">
            <button class="btn sec" id="prev" style="flex:1" ${ex.i?'':'disabled'}>이전</button>

function tierOf(score){
  if(score>=100) return {tier:'pass',tierLabel:'특등권'};
  if(score>=80) return {tier:'pass',tierLabel:'우수상 이상'};
  if(score>=60) return {tier:'mid',tierLabel:'장려상'};
  return {tier:'fail',tierLabel:'다시 배우는 기회'};
}
function submitExam(){
  clearInterval(exT);
  let score=0, maxScore=0, correctN=0;
  ex.qs.forEach((q,j)=>{ const pts=q.pts||2; maxScore+=pts;
    const ok=isCorrect(q,ex.ans[j]); if(ok){score+=pts;correctN++;} record(q,ok); });
  score=Math.round(score*10)/10; maxScore=Math.round(maxScore*10)/10;
  const {tier,tierLabel}=tierOf(score);
  const wrongArea={};
  ex.qs.forEach((q,j)=>{ if(!isCorrect(q,ex.ans[j])){ const k=q.s+'|'+(q.a||'기타');
    wrongArea[k]=(wrongArea[k]||0)+1; } });
  S.rx=Object.entries(wrongArea).sort((a,b)=>b[1]-a[1]).slice(0,6)
       .map(([k,n])=>({k,n,d:today()}));
  Object.assign(ex,{score,maxScore,correctN,tier,tierLabel,phase:'done'});
  S.exams.push({d:today(),set:ex.setName,score,tier,tierLabel}); save(); vExam();
}
